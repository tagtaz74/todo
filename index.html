<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo アプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .input-row input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input[type="text"]:focus {
      border-color: #6366f1;
    }

    .tag-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      align-items: center;
    }

    .tag-row label {
      font-size: 0.85rem;
      color: #6b7280;
      white-space: nowrap;
    }

    .tag-row input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .tag-row input[type="text"]:focus {
      border-color: #6366f1;
    }

    .tag-suggestions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-suggestion {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    .tag-suggestion:hover {
      opacity: 0.75;
    }

    .btn-add {
      padding: 10px 18px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background: #4f46e5;
    }

    /* フィルター */
    .filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }

    .filter-btn.all {
      background: #e5e7eb;
      color: #374151;
    }

    .filter-btn.all.active {
      background: #374151;
      color: #fff;
    }

    .filter-btn.active {
      border-color: currentColor;
      filter: brightness(0.85);
    }

    /* タスクリスト */
    #todo-list {
      list-style: none;
      margin-bottom: 20px;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s;
    }

    #todo-list li:last-child {
      border-bottom: none;
    }

    #todo-list li:hover {
      background: #fafafa;
      border-radius: 8px;
    }

    #todo-list li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #todo-list li label {
      font-size: 0.95rem;
      color: #374151;
      cursor: pointer;
      transition: color 0.2s, text-decoration 0.2s;
    }

    #todo-list li.done label {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .tag-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      width: fit-content;
    }

    .empty-msg {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      padding: 20px 0;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
    }

    .btn-delete {
      padding: 10px 20px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-delete:hover {
      background: #dc2626;
    }

    .btn-delete:disabled {
      background: #fca5a5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo リスト</h1>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="タスクを入力..." />
      <button class="btn-add" onclick="addTask()">追加</button>
    </div>
    <div class="tag-row">
      <label>タグ:</label>
      <input type="text" id="tag-input" placeholder="タグ名を入力（任意）" />
      <div class="tag-suggestions" id="tag-suggestions"></div>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn all active" onclick="setFilter(null)">すべて</button>
    </div>

    <ul id="todo-list"></ul>
    <p class="empty-msg" id="empty-msg">タスクがありません</p>

    <div class="footer">
      <button class="btn-delete" id="delete-btn" onclick="deleteChecked()" disabled>
        完了済みを削除
      </button>
    </div>
  </div>

  <script>
    let tasks = [];
    let nextId = 0;
    let activeFilter = null;

    // タグごとの色定義
    const TAG_COLORS = [
      { bg: '#dbeafe', text: '#1d4ed8' },
      { bg: '#dcfce7', text: '#15803d' },
      { bg: '#fef9c3', text: '#a16207' },
      { bg: '#fce7f3', text: '#be185d' },
      { bg: '#ede9fe', text: '#6d28d9' },
      { bg: '#ffedd5', text: '#c2410c' },
      { bg: '#e0f2fe', text: '#0369a1' },
      { bg: '#f1f5f9', text: '#475569' },
    ];
    const tagColorMap = {};
    let colorIndex = 0;

    function getTagColor(tag) {
      if (!tagColorMap[tag]) {
        tagColorMap[tag] = TAG_COLORS[colorIndex % TAG_COLORS.length];
        colorIndex++;
      }
      return tagColorMap[tag];
    }

    const taskInput = document.getElementById('task-input');
    const tagInput = document.getElementById('tag-input');
    const list = document.getElementById('todo-list');
    const emptyMsg = document.getElementById('empty-msg');
    const deleteBtn = document.getElementById('delete-btn');
    const filterBar = document.getElementById('filter-bar');
    const tagSuggestions = document.getElementById('tag-suggestions');

    // 日本語入力対応
    let isComposing = false;
    taskInput.addEventListener('compositionstart', () => { isComposing = true; });
    taskInput.addEventListener('compositionend', () => { isComposing = false; });
    taskInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !isComposing) addTask();
    });
    tagInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !isComposing) taskInput.focus();
    });

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      const tag = tagInput.value.trim() || null;
      tasks.push({ id: nextId++, text, tag, done: false });
      taskInput.value = '';
      tagInput.value = '';
      render();
      taskInput.focus();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      render();
    }

    function deleteChecked() {
      tasks = tasks.filter(t => !t.done);
      render();
    }

    function setFilter(tag) {
      activeFilter = tag;
      render();
    }

    function setTagInput(tag) {
      tagInput.value = tag;
      tagInput.focus();
    }

    function getAllTags() {
      const tags = new Set();
      tasks.forEach(t => { if (t.tag) tags.add(t.tag); });
      return [...tags];
    }

    function render() {
      // フィルターバー更新
      const allTags = getAllTags();

      // タグ候補ボタン更新
      tagSuggestions.innerHTML = '';
      allTags.forEach(tag => {
        const color = getTagColor(tag);
        const btn = document.createElement('button');
        btn.className = 'tag-suggestion';
        btn.textContent = tag;
        btn.style.background = color.bg;
        btn.style.color = color.text;
        btn.onclick = () => setTagInput(tag);
        tagSuggestions.appendChild(btn);
      });

      // フィルターボタン更新
      filterBar.innerHTML = '';
      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn all' + (activeFilter === null ? ' active' : '');
      allBtn.textContent = 'すべて';
      allBtn.onclick = () => setFilter(null);
      filterBar.appendChild(allBtn);

      allTags.forEach(tag => {
        const color = getTagColor(tag);
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (activeFilter === tag ? ' active' : '');
        btn.textContent = tag;
        btn.style.background = color.bg;
        btn.style.color = color.text;
        btn.onclick = () => setFilter(activeFilter === tag ? null : tag);
        filterBar.appendChild(btn);
      });

      // タスクリスト更新
      const filtered = activeFilter === null
        ? tasks
        : tasks.filter(t => t.tag === activeFilter);

      list.innerHTML = '';
      filtered.forEach(task => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = `task-${task.id}`;
        cb.checked = task.done;
        cb.addEventListener('change', () => toggleTask(task.id));

        const body = document.createElement('div');
        body.className = 'task-body';

        const label = document.createElement('label');
        label.htmlFor = `task-${task.id}`;
        label.textContent = task.text;
        body.appendChild(label);

        if (task.tag) {
          const color = getTagColor(task.tag);
          const badge = document.createElement('span');
          badge.className = 'tag-badge';
          badge.textContent = task.tag;
          badge.style.background = color.bg;
          badge.style.color = color.text;
          body.appendChild(badge);
        }

        li.appendChild(cb);
        li.appendChild(body);
        list.appendChild(li);
      });

      emptyMsg.style.display = filtered.length === 0 ? 'block' : 'none';
      deleteBtn.disabled = !tasks.some(t => t.done);
    }

    render();
  </script>
</body>
</html>
